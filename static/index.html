<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume JD Matcher</title>
  <meta name="description" content="Score how well your resume matches a job description and see your skill gaps.">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5d6b7c;
      --line: #d9dee5; --accent: #2f6fed; --accent-text: #ffffff;
      --good: #1f8a4c; --good-bg: #e3f4ea; --bad: #b3261e; --bad-bg: #fbe7e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c; --card: #1b212a; --text: #e8ecf1; --muted: #9aa7b6;
        --line: #2e3744; --accent: #6c9bff; --accent-text: #0b1220;
        --good: #6fd39a; --good-bg: #16301f; --bad: #ff8a80; --bad-bg: #3a1c1a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .page { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .lead { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.1rem; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 0.9rem; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 0.85rem; }
    textarea, input[type=file] {
      width: 100%; padding: 10px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    textarea { flex: 1; min-height: 260px; resize: vertical; }
    textarea:focus, input:focus, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    .actions { display: flex; align-items: center; gap: 16px; margin: 20px 0 8px; }
    button {
      padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer;
      font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text);
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { color: var(--muted); }

    /* Result styles: Day 10's JavaScript builds markup that uses these classes. */
    .result {
      margin-top: 16px; padding: 20px;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    }
    .score { margin: 0; font-size: 2.4rem; font-weight: 700; }
    .bar { height: 10px; margin: 8px 0 16px; overflow: hidden; background: var(--line); border-radius: 999px; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; padding: 0; list-style: none; }
    .chip { padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; }
    .chip.ok { background: var(--good-bg); color: var(--good); }
    .chip.miss { background: var(--bad-bg); color: var(--bad); }
    .error { padding: 10px 14px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); }

    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Resume and JD Matcher</h1>
      <p class="lead">
        Paste a job description, add your resume, and see how well they match,
        which skills you cover, and where the gaps are.
      </p>
    </header>

    <form id="match-form" action="/analyze" method="post" enctype="multipart/form-data">
      <div class="grid">
        <section class="card">
          <h2>Your resume</h2>
          <label for="resume-file">Upload a PDF</label>
          <input type="file" id="resume-file" name="resume" accept="application/pdf,.pdf">
          <p class="hint">Or paste the text instead:</p>
          <label for="resume-text">Resume text</label>
          <textarea id="resume-text" name="resume_text" placeholder="Paste your resume text here"></textarea>
        </section>

        <section class="card">
          <h2>Job description</h2>
          <label for="jd-text">Job description text</label>
          <textarea id="jd-text" name="jd_text" required placeholder="Paste the full job description here"></textarea>
        </section>
      </div>

      <div class="actions">
        <button type="submit" id="analyze-btn">Analyze match</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>
</body>
</html>
